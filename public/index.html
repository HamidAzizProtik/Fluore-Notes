<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluore Notes</title>
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <meta name="google-site-verification" content="DSH0HZp0ZJgHmGOEcTpcjYUxs8lS-x4-sncp4mgwa3U">

    <script async crossorigin="anonymous" src="https://fast-swan-86.clerk.accounts.dev/npm/@clerk/ui@latest/dist/ui.browser.js" type="text/javascript"></script>
    <script async crossorigin="anonymous" data-clerk-publishable-key="pk_test_ZmFzdC1zd2FuLTg2LmNsZXJrLmFjY291bnRzLmRldiQ" src="https://fast-swan-86.clerk.accounts.dev/npm/@clerk/clerk-js@6/dist/clerk.browser.js" type="text/javascript"></script>

    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>

    <div id="authContainer" class="auth-container">
        <div class="auth-header">
            <h1 class="auth-title">Fluore Notes</h1>
            <p class="auth-subtitle">Your secure personal workspace</p>
        </div>
        
        <div id="authLoader" class="auth-loader">
            <div class="auth-spinner"></div>
            <span>Loading secure workspace...</span>
        </div>
        
        <div id="clerkSignIn"></div>
    </div>

    <div id="appContainer" class="app-container" style="display: none;">
        <header>
            <h1>Fluore Notes</h1>

            <input type="text" id="searchInput" class="search-bar" placeholder="Search notes...">

            <div class="header-actions">
                <button class="add-note-btn" onclick="openNoteDialog()">+ Add Note</button>
                <button id="themeToggleBtn" class="theme-toggle-btn" aria-label="Toggle theme">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                    </svg>
                </button>

                <div id="userButton" class="user-button-container"></div>
            </div>
        </header>

        <main id="notesContainer" class="notes-grid"></main>

        <dialog id="noteDialog">
            <div class="dialog-content">
                <div class="dialog-header">
                    <h2 class="dialog-title" id="dialogTitle">Add New Note</h2>
                    <button type="button" class="close-btn" onclick="closeNoteDialog()" aria-label="Close dialog">&times;</button>
                </div>

                <form id="noteForm">
                    <div class="form-group">
                        <label for="noteTitle" class="form-label">Title</label>
                        <input type="text" id="noteTitle" class="form-input" placeholder="Enter Note Title..." required>
                    </div>

                    <div class="form-group">
                        <label for="noteContent" class="form-label">Content</label>
                        <textarea id="noteContent" class="form-textarea" placeholder="Write your note here..." required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="noteColor" class="form-label">Card Color</label>
                        <select id="noteColor" class="form-input">
                            <option value="">🎨 Default</option>
                            <option value="#FF3B30">🔴 Dusty Rose</option>
                            <option value="#FF9500">🟠 Warm Peach</option>
                            <option value="#FFCC00">🟡 Butter Cream</option>
                            <option value="#34C759">🟢 Sage Green</option>
                            <option value="#007AFF">🔵 Ice Cyan</option>
                            <option value="#AF52DE">🟣 Muted Lavender</option>
                        </select>
                    </div>

                    <div class="dialog-actions">
                        <button type="button" class="cancel-btn" onclick="closeNoteDialog()">Cancel</button>
                        <button type="submit" class="save-btn">Save Note</button>
                    </div>
                </form>
            </div>
        </dialog>
    </div>

    <script>
        // core color variables shared by every Clerk component
        function getThemeSync() {
            const isDark = document.body.classList.contains('dark-theme');
            return {
                colorPrimary: '#fd7041',
                colorTextOnPrimaryBackground: '#1f1a17', // dark text on the orange primary button
                colorBackground: isDark ? '#2d2520' : '#fff3f8',

                colorText: isDark ? '#fff3f8' : '#36302a',
                colorTextSecondary: isDark ? '#eec197' : '#7a5c43',

                colorInputBackground: isDark ? '#1f1a17' : '#ffffff',
                colorInputText: isDark ? '#fff3f8' : '#36302a',
                borderRadius: '0.75rem',
            };
        }

        function getThemeElements() {
            const isDark = document.body.classList.contains('dark-theme');
            const text = isDark ? '#fff3f8' : '#36302a';
            const textSecondary = isDark ? '#eec197' : '#7a5c43';
            const inputBg = isDark ? '#1f1a17' : '#ffffff';
            const cardBg = isDark ? '#2d2520' : '#fff3f8';
            const border = isDark ? '#eec197' : '#7a5c43';

            return {
                card: {
                    backgroundColor: cardBg,
                    boxShadow: 'none',
                    border: 'none'
                },
                headerTitle: { color: text },
                headerSubtitle: { color: textSecondary },

                socialButtonsBlockButton: {
                    borderColor: border,
                    backgroundColor: inputBg,
                    color: text
                },
                socialButtonsBlockButtonText: { color: text },

                dividerLine: { background: border },
                dividerText: { color: textSecondary },

                formFieldLabel: { color: text },
                formFieldInput: {
                    backgroundColor: inputBg,
                    borderColor: border,
                    color: text
                },
                otpCodeFieldInput: {
                    backgroundColor: inputBg,
                    borderColor: border,
                    color: text
                },
                formResendCodeLink: { color: '#fd7041' },

                footerActionText: { color: textSecondary },
                footerActionLink: { color: '#fd7041' },

                identityPreviewText: { color: text },
                identityPreviewEditButtonIcon: { color: '#fd7041' },

                badge: { color: '#fd7041', borderColor: '#fd7041' },
                footer: { background: 'transparent' },

                // account popover (Image 3) — previously had zero styling at all
                userButtonPopoverCard: {
                    backgroundColor: cardBg,
                    border: `1px solid ${border}`,
                    boxShadow: 'none'
                },
                userButtonPopoverMain: { backgroundColor: cardBg },
                userPreviewMainIdentifier: { color: text },
                userPreviewSecondaryIdentifier: { color: textSecondary },
                userButtonPopoverActionButton: {
                    color: text,
                    backgroundColor: inputBg
                },
                userButtonPopoverActionButtonText: { color: text },
                userButtonPopoverActionButtonIcon: { color: textSecondary },
                userButtonPopoverFooter: { background: 'transparent' }
            };
        }

        // expose for app.js (ToggleTheme re-mounts the user button on theme switch)
        window.getThemeElements = getThemeElements;

        window.addEventListener('load', async () => {
            const authContainer = document.getElementById('authContainer');
            const appContainer = document.getElementById('appContainer');
            const authLoader = document.getElementById('authLoader');

            try {
                await window.Clerk?.load({
                    ui: { ClerkUI: window.__internal_ClerkUICtor }
                });
                
                if (authLoader) authLoader.style.display = 'none';

                if (!window.Clerk?.user) {
                    appContainer.style.display = 'none';
                    authContainer.style.display = 'flex';

                    window.Clerk.mountSignIn(document.getElementById('clerkSignIn'), {
                        afterSignInUrl: window.location.href,
                        afterSignUpUrl: window.location.href,
                        appearance: {
                            variables: getThemeSync(),
                            elements: getThemeElements()
                        }
                    });
                } else {
                    authContainer.style.display = 'none';
                    appContainer.style.display = 'block';

                    if (typeof initNotesApp === 'function') {
                        initNotesApp();
                    }

                    window.Clerk.mountUserButton(document.getElementById('userButton'), {
                        afterSignOutUrl: window.location.href,
                        appearance: {
                            variables: getThemeSync(),
                            elements: getThemeElements()
                        }
                    });
                }
            } catch (err) {
                console.error("Clerk setup crash:", err);
                if (authLoader) {
                    authLoader.innerHTML = '<span style="color: #ff5252;">Failed to load authentication. Check connection.</span>';
                }
            }
        });
    </script>
</body>
</html>
