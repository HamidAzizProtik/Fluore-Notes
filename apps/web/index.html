<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluore Notes</title>

    <meta name="google-site-verification" content="DSH0HZp0ZJgHmGOEcTpcjYUxs8lS-x4-sncp4mgwa3U" />

    <script
        src="https://js.sentry-cdn.com/c8f91f87a39161efba118c9aa3c41ac3.min.js"
        crossorigin="anonymous"
    ></script>

    <script>
        Sentry.onLoad(function() {
            Sentry.init({
                tracesSampleRate: 1.0,
            });
        });
    </script>

    <script
        async
        crossorigin="anonymous"
        data-clerk-publishable-key="pk_test_ZmFzdC1zd2FuLTg2LmNsZXJrLmFjY291bnRzLmRldiQ"
        src="https://fast-swan-86.clerk.accounts.dev/npm/@clerk/clerk-js@6/dist/clerk.browser.js"
        type="text/javascript"
    ></script>

    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body class="dark-theme">

    <div id="authContainer" style="display: flex; min-height: 100vh; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; gap: 1.5rem;">
        <div style="text-align: center;">
            <h1 style="font-size: 2.5rem; font-weight: 800; color: var(--text-color); margin-bottom: 0.5rem;">Fluore Notes</h1>
            <p style="color: var(--secondary-text-color);">Your secure personal workspace</p>
        </div>
        
        <div id="authLoader" style="color: var(--secondary-text-color); font-size: 0.95rem;">Loading secure workspace...</div>
        
        <div id="clerkSignIn"></div>
    </div>

    <div id="appContainer" style="display: none;">
        <header>
            <h1>Fluore Notes</h1>

            <input type="text" id="searchInput" class="search-bar" placeholder="Search...">

            <div class="header-actions">
                <button class="add-note-btn" onclick="openNoteDialog()">+ Add Note</button>
                <button id="themeToggleBtn" class="theme-toggle-btn" aria-label="Toggle theme">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                </button>

                <div id="userButton" style="display: flex; align-items: center;"></div>
            </div>
        </header>

        <main id="notesContainer" class="notes-grid"></main>

        <dialog id="noteDialog">
            <div class="dialog-content">
                <div class="dialog-header">
                    <h2 class="dialog-title" id="dialogTitle">Add New Note</h2>
                    <button class="close-btn" onclick="closeNoteDialog()">×</button>
                </div>

                <form id="noteForm">
                    <div class="form-group">
                        <label for="noteTitle" class="form-label">Title</label>
                        <input type="text" id="noteTitle" class="form-input" placeholder="Enter Note Title..." required>
                    </div>

                    <div class="form-group">
                        <label for="noteContent" class="form-label">Content</label>
                        <textarea id="noteContent" class="form-textarea" placeholder="Write your note here..." required></textarea>
                    </div>

                    <div class="form-group">
                        <select id="noteColor" class="form-input">
                            <option value="">🎨 Default</option>
                            <option value="#FF3B30">🔴 Dusty Rose</option>
                            <option value="#FF9500">🟠 Warm Peach</option>
                            <option value="#FFCC00">🟡 Butter Cream</option>
                            <option value="#34C759">🟢 Sage Green</option>
                            <option value="#007AFF">🔵 Ice Cyan</option>
                            <option value="#AF52DE">🟣 Muted Lavender</option>
                            <option value="#2d2520">⚪ Dark Slate Gray</option>
                        </select>
                    </div>

                    <div class="dialog-actions">
                        <button type="button" class="cancel-btn" onclick="closeNoteDialog()">Cancel</button>
                        <button type="submit" class="save-btn">Save Note</button>
                    </div>
                </form>
            </div>
        </dialog>
    </div>

    <script>
        window.addEventListener('load', async () => {
            const authContainer = document.getElementById('authContainer');
            const appContainer = document.getElementById('appContainer');
            const authLoader = document.getElementById('authLoader');

            try {
                // Ensure Clerk script is fully initialized
                await Clerk.load();
                
                // Hide loader once ready
                if (authLoader) authLoader.style.display = 'none';

                if (!Clerk.user) {
                    appContainer.style.display = 'none';
                    authContainer.style.display = 'flex';

                    Clerk.mountSignIn(document.getElementById('clerkSignIn'), {
                        afterSignInUrl: window.location.href,
                        afterSignUpUrl: window.location.href,
                        appearance: {
                            variables: {
                                colorPrimary: '#fd7041',       
                                colorBackground: '#2d2520',    
                                colorText: '#fff3f8',          
                                colorTextSecondary: '#eec197', 
                                borderRadius: '0.75rem',       
                            },
                            elements: {
                                card: {
                                    boxShadow: '0 4px 20px rgba(0, 0, 0, 0.5)',
                                    border: '1px solid #2d2520'
                                }
                            }
                        }
                    });
                } else {
                    authContainer.style.display = 'none';
                    appContainer.style.display = 'block';

                    if (typeof initNotesApp === 'function') {
                        initNotesApp();
                    }

                    Clerk.mountUserButton(document.getElementById('userButton'), {
                        afterSignOutUrl: window.location.href
                    });
                }
            } catch (err) {
                console.error("Authentication failed to initialize:", err);
                if (authLoader) {
                    authLoader.innerHTML = '<span style="color: #ff5252;">Failed to load authentication. Please disable ad-blockers or refresh.</span>';
                }
            }
        });
    </script>
</body>
</html>
